version: '3.8'

services:
  shareable-stickies:
    image: ghcr.io/raviwarrier/shareable-stickies:latest
    container_name: shareable-stickies
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - STORAGE_DRIVER=local
      - ALLOW_PUBLIC_PASTES=${ALLOW_PUBLIC_PASTES}
      - ALLOW_ANONYMOUS_CREATION=${ALLOW_ANONYMOUS_CREATION}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
